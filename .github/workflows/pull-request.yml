name: Pull Request
on:
  pull_request:
    branches:
      - main

# Untrusted stage: runs the contributor's code (lint/test/build) and so must
# never have access to secrets or a write-scoped token. GitHub already enforces
# a read-only GITHUB_TOKEN and withholds secrets for fork PRs; we mirror that
# with least-privilege permissions here.
jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The example application's Playwright suite (docs/examples/app) runs the
    # real stack: the NestJS API against this MongoDB and the Angular dev
    # server, both started by Playwright. The suite is opt-in through
    # RUN_EXAMPLE_APP_E2E so that `nx run-many -t test` stays runnable on a
    # machine without MongoDB.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      - name: Load & cache dependencies
        id: cache-deps
        uses: ./.github/actions/cached-deps
        with:
          node-version: '26.5.1'
      - run: npx nx format:check --base=origin/${{ github.event.pull_request.base.ref }}
      - run: npx nx run-many -t lint --max-parallel=4
      # An application built here against the path aliases compiles the
      # framework sources with its own tsconfig, and a new Nx workspace enables
      # strict and isolatedModules. The packages' own tsconfigs do not, so check
      # the sources the way that consumer does (tools/tsconfig.strict.json).
      - run: npx nx run smartsoft001:strict-typecheck
      - run: npx nx run docs:check
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for the example app's Playwright suite
        run: npx playwright install --with-deps chromium
      - run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx nx run-many -t test --max-parallel=4
        env:
          RUN_EXAMPLE_APP_E2E: '1'
      - run: npx nx run-many -t build --max-parallel=4
      # A package can pass every unit test and still be impossible to install:
      # the suites compile the sources, never the artefact. Load what the build
      # produced, the way a consumer would.
      - run: npm run verify:dist
