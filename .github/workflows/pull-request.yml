name: Pull Request
on:
  pull_request:
    branches:
      - main

# Untrusted stage: runs the contributor's code (lint/test/build) and so must
# never have access to secrets or a write-scoped token. GitHub already enforces
# a read-only GITHUB_TOKEN and withholds secrets for fork PRs; we mirror that
# with least-privilege permissions here. The Claude review itself runs in the
# trusted "Claude PR Review" workflow (claude-review.yml), triggered via
# workflow_run after this one completes.
jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      - name: Load & cache dependencies
        id: cache-deps
        uses: ./.github/actions/cached-deps
        with:
          node-version: '24.5.0'
      - run: npx nx format:check --base=origin/${{ github.event.pull_request.base.ref }}
      - run: npx nx run-many -t lint --max-parallel=4
      - run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx nx run-many -t test --max-parallel=4
      - run: npx nx run-many -t build --max-parallel=4
      # Produce the diff for the review. We deliberately do NOT run Claude or
      # post comments here (no secrets / read-only token on fork PRs). Only the
      # diff text is handed off; the PR number is re-derived from the trusted
      # head SHA in the review workflow, so nothing here can target another PR.
      - name: Prepare review payload
        run: |
          mkdir -p review-payload
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > review-payload/pr.diff

      - name: Upload review payload
        uses: actions/upload-artifact@v4
        with:
          name: review-payload
          path: review-payload/
          retention-days: 1
