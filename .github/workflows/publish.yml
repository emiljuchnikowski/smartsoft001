name: Publish
on:
  push:
    branches:
      - main

# Two merges in quick succession would otherwise race for the same version number:
# both runs bump from the same base, both tag, and the second push is rejected as
# non-fast-forward after the packages are already on npm. Queue them instead.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  main:
    if: github.repository_owner == 'emiljuchnikowski'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      # A publish run releases main, not the commit that triggered it. The
      # concurrency group serialises the runs, so by the time a queued run
      # starts, the previous run has written its release commit back to main.
      # Checking out the trigger commit instead starts from before that
      # write-back: the version still resolves correctly from the tag, but the
      # new release commit then changes the same manifest lines the previous
      # write-back changed, the rebase below conflicts, and the write-back is
      # rejected (v2.161.0, FRA-391).
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: run trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL'
      - name: Check for vulnerabilities
        id: check
        run: |
          if grep -q "CRITICAL" trivy-results.txt; then
            echo "Critical vulnerability found, stopping the workflow."
            cat trivy-results.txt
            exit 1
          else
            echo "No critical vulnerabilities found."
          fi
      - name: Load & cache dependencies
        id: cache-deps
        uses: ./.github/actions/cached-deps
        with:
          node-version: '26.5.1'
      - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"
      - run: npx nx format:check
      - run: npx nx affected -t lint test build check
      # nx reads the current version from the latest release tag, not from the
      # manifests, so a write-back to main that failed on the previous run cannot
      # make this run compute a version that is already on npm. The root manifest
      # is not a release project; it follows whatever nx decided.
      - name: Set version
        run: |
          npx nx release version minor
          version="$(node -p "require('./packages/meta/core/package.json').version")"
          npm version "$version" --no-git-tag-version --allow-same-version
      - id: package
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Set up Git user
        run: |
          git config --global user.name "Emil Juchnikowski"
          git config --global user.email "emil@juchnikowski.com"
      - name: Update changelog
        run: npx nx release changelog ${{ steps.package.outputs.version }} --git-commit-args="--no-verify"
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: false
      - name: Set NPM token
        run: echo //registry.npmjs.org/:_authToken="${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Check login
        run: npm whoami
      # The version bump reruns the full build as its preVersionCommand, so this
      # is the last moment the artefacts can be checked before they reach npm.
      - name: Check the built packages can be loaded
        run: npm run verify:dist
      # A package can load and still not work in an application: a missing peer,
      # a broken export, a migration that does not do its job. Install the example
      # app from these tarballs, then migrate it from the previous release. The
      # previous release is the one the registry serves, not the latest tag on
      # main: a release whose write-back was rejected is on npm and on no branch.
      - name: Check the release on the example application
        run: npm run verify:example-app -- --previous "$(npm view @smartsoft001/core version)"
      - name: Publish to NPM
        run: npx nx run-many -t nx-release-publish
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: false
      # The packages are on npm at this version now, so the version is burnt
      # whatever happens next. Push the tag on its own, before the branch: a tag
      # push is never rejected as non-fast-forward, and the next run reads the
      # latest tag across all branches, so a failed write-back below cannot make
      # it reuse this number.
      - name: Push the release tag
        run: git push origin "refs/tags/v${{ steps.package.outputs.version }}"
      # Ten minutes have passed since checkout. If main moved, the write-back
      # below is not a fast-forward and is rejected. Move the release commit on
      # top of the current main first, keeping the tag on the moved commit.
      # The tree is dirty here on purpose: `npm version` changed the root
      # manifest and only the write-back step commits it, so the rebase has to
      # autostash. Without that the first real collision (v2.154.0) failed on
      # "cannot rebase: You have unstaged changes", and the abort of a rebase
      # that never started failed the step a second time.
      - name: Bring the release commit onto the current main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main has not moved"
            exit 0
          fi
          tag="v${{ steps.package.outputs.version }}"
          if git rebase --autostash origin/main; then
            git tag -f -a "$tag" -m "$tag" HEAD
            git push --force origin "refs/tags/$tag"
            echo "rebased onto origin/main and moved $tag"
          else
            git rebase --abort 2>/dev/null || true
            echo "::warning::main moved and the release commit does not rebase cleanly; the write-back will be rejected. The tag is already pushed, so the next release is unaffected."
          fi
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'build(github): publish ${{ steps.package.outputs.version }} [skip ci]'
          push_options: '--follow-tags --no-verify'
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: false

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Release ${{ steps.package.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The starter repository is the example application as something to clone,
  # generated from docs/examples/app and pinned to the release just cut, so
  # that it cannot drift from the framework. The job is gated on the
  # STARTER_REPOSITORY repository variable (for example
  # `emiljuchnikowski/smartsoft001-starter`) because a fork, or this
  # repository before the variable is set, has nowhere to push to and must
  # still release. STARTER_DEPLOY_TOKEN is a token with write access to that
  # repository and is used only at push time. Marking the repository as a
  # template, which puts "Use this template" on its page, is a one-time
  # setting in its GitHub settings, not something this job can do.
  starter:
    needs: [main]
    if: needs.main.result == 'success' && vars.STARTER_REPOSITORY != ''
    runs-on: ubuntu-24.04
    steps:
      # The tag, not main: the write-back to main can be rejected when main
      # moved, but the tag is always pushed, and it is the release the
      # packages on npm were built from.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.main.outputs.version }}
      # The two scripts below need Node and nothing from node_modules: the
      # starter installs its own dependencies into a scratch directory.
      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.1'
      - name: Generate the starter from the example application
        run: npm run build:starter -- --version "${{ needs.main.outputs.version }}" --target "$RUNNER_TEMP/starter"
      # A clean clone of the generated commit has to install from the
      # lockfile, build and test on its own. If it does not, nothing is pushed
      # and the release fails here, with the packages already on npm.
      - name: Check the starter from a clean clone
        run: npm run verify:starter -- "$RUNNER_TEMP/starter"
      # The generated repository has one commit on an unrelated history. To
      # keep one commit per release on the starter's main, the release commit
      # is re-parented on top of the current origin/main: `git reset --soft`
      # moves HEAD there and leaves the index, which is the generated tree, so
      # the new commit carries exactly that tree. An empty repository has no
      # main to fetch, and the generated commit is pushed as it is.
      - name: Push the release to the starter repository
        working-directory: ${{ runner.temp }}/starter
        env:
          STARTER_REPOSITORY: ${{ vars.STARTER_REPOSITORY }}
          STARTER_DEPLOY_TOKEN: ${{ secrets.STARTER_DEPLOY_TOKEN }}
          VERSION: ${{ needs.main.outputs.version }}
        run: |
          git remote add origin "https://x-access-token:${STARTER_DEPLOY_TOKEN}@github.com/${STARTER_REPOSITORY}.git"
          if git fetch origin main; then
            git reset --soft origin/main
            git -c user.name="smartsoft001 release" -c user.email="noreply@github.com" \
              commit --quiet -m "chore: release ${VERSION}"
          else
            echo "the starter repository is empty; pushing the first release"
          fi
          git push origin main

  refresh-usage:
    needs: [main]
    runs-on: ubuntu-latest
    steps:
      - name: Update dependencies
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MOBILEMS_DEPLOY_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'smartsoft001',
              repo: 'mobilems-framework',
              ref: 'main',
              workflow_id: 'update.yml'
            })
