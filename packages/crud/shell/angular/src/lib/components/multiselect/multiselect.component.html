@let list = this.list();
@if (list) {
  <header
    class="smart:flex smart:items-center smart:justify-between smart:border-b smart:border-gray-200 smart:px-4 smart:py-3"
  >
    <h2 class="smart:text-lg smart:font-semibold smart:text-gray-900">
      {{ 'selected' | translate }}: {{ list.length }}
    </h2>
    <button
      type="button"
      (click)="onClose()"
      aria-label="close"
      class="smart:rounded smart:p-1 smart:text-gray-500 smart:hover:bg-gray-100"
    >
      ✕
    </button>
  </header>

  @if (config?.list?.components?.multi) {
    <div>
      <ng-template
        [ngComponentOutlet]="config?.list?.components?.multi"
        [ndcDynamicInputs]="{ items: list }"
      ></ng-template>
    </div>
  }

  @if (showForm && item) {
    <div>
      <smart-form
        [options]="item | smartFormOptions: 'multiUpdate' : config.type"
        (valuePartialChange)="onPartialChange($event, list)"
        (validChange)="onValidChange($event)"
      ></smart-form>

      <smart-button
        class="smart:float-right"
        [disabled]="lock || !valid"
        [options]="buttonOptions"
      >
        {{ 'change' | translate }}
      </smart-button>
    </div>
  }
}
