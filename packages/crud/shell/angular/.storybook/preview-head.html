<style>
  /*
    Storybook page surface only — not part of the published library stylesheet.

    Driven by the same `.dark` class that preview.ts toggles, so the canvas
    follows the theme through CSS rather than inline JS. Light mode is plain
    white on purpose: the preset components are Preline / HyperUI / Tailwind UI
    derived and assume a white page. The previous inline `#f9fafb` (gray-50)
    made gray-100 selected states, gray-50 surfaces and hairline borders
    disappear against the canvas.

    Plain CSS rather than Tailwind utilities because this file is injected
    straight into <head>, outside the Angular/PostCSS pipeline that processes
    styles.css.

    (Note: `packages/shared/angular/tailwind.config.js` excludes *.stories.ts
    from its content globs, but that file is unreferenced dead config — the
    `@config` in styles.css points at the ROOT tailwind.config.js, which has no
    `content` key, so Tailwind v4 automatic source detection is active and does
    scan story files. `smart:` classes used only in stories DO compile.)
  */
  html,
  body {
    background-color: #ffffff;
    color: #111827;
  }

  html.dark,
  body.dark {
    background-color: #111827;
    color: #f9fafb;
  }
</style>
