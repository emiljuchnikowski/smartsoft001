@if (show()) {
  <div [class]="containerClasses()">
    <input
      type="search"
      [formControl]="control()"
      [class]="inputClasses()"
      [placeholder]="options()?.placeholder ?? 'search' | translate"
      (blur)="tryHide()"
    />
    <svg
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
      data-icon="magnifying-glass"
      class="smart:pointer-events-none smart:absolute smart:inset-y-0 smart:right-0 smart:mr-3 smart:size-5 smart:self-center smart:text-gray-400 smart:dark:text-gray-500"
    >
      <path
        d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z"
        clip-rule="evenodd"
        fill-rule="evenodd"
      />
    </svg>
  </div>
} @else if (options()?.showToggleButton) {
  <button
    type="button"
    [class]="toggleButtonClasses()"
    [attr.aria-label]="'search' | translate"
    (click)="setShow()"
  >
    <svg
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
      data-icon="magnifying-glass"
      class="smart:size-5"
    >
      <path
        d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z"
        clip-rule="evenodd"
        fill-rule="evenodd"
      />
    </svg>
  </button>
}
