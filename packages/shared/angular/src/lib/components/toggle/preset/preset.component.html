<div [class]="containerClasses() + ' ' + cssClass()">
  @if (hasText() && labelPosition() === 'left') {
    <ng-container [ngTemplateOutlet]="text" />
  }

  <label [class]="switchClasses()">
    <input
      type="checkbox"
      [id]="inputId"
      [class]="inputClasses"
      [checked]="value()"
      [disabled]="disabled()"
      [attr.aria-label]="label() ? null : ariaLabel()"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (change)="onChange($event)"
    />
    <span [class]="trackClasses()"></span>
    <span [class]="thumbClasses()"></span>
  </label>

  @if (hasText() && labelPosition() === 'right') {
    <ng-container [ngTemplateOutlet]="text" />
  }
</div>

<ng-template #text>
  <span [class]="textWrapClasses()">
    @if (label()) {
      <label [class]="labelClasses()" [for]="inputId">{{ label() }}</label>
    }
    @if (description()) {
      <span [class]="descriptionClasses()" [id]="descriptionId">{{
        description()
      }}</span>
    }
  </span>
</ng-template>
