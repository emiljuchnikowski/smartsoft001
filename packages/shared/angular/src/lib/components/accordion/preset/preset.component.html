<div [class]="containerClasses()">
  <button
    type="button"
    [class]="toggleClasses()"
    [disabled]="disabled()"
    [attr.aria-expanded]="show()"
    [attr.aria-controls]="contentId"
    (click)="toggle()"
  >
    <ng-container [ngTemplateOutlet]="headerTpl()"></ng-container>

    @if (show()) {
      <svg
        [class]="iconClasses"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m18 15-6-6-6 6" />
      </svg>
    } @else {
      <svg
        [class]="iconClasses"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    }
  </button>

  @if (show()) {
    <div [id]="contentId" [class]="contentClasses()" role="region">
      <ng-container [ngTemplateOutlet]="bodyTpl()"></ng-container>
    </div>
  }
</div>
