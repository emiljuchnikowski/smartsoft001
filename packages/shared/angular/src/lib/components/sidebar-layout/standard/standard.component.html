<!--
  Captured once: Angular projects default content into the last wildcard
  <ng-content> only, so one per @if branch would leave <main> empty in the
  other branch.
-->
<ng-template #content><ng-content /></ng-template>
<div [class]="cssClass()">
  @if (options()?.headerTpl) {
    <header>
      <ng-container [ngTemplateOutlet]="options()!.headerTpl!" />
    </header>
  }
  @if (isRightSidebar()) {
    <main>
      <ng-container [ngTemplateOutlet]="content" />
    </main>
    <aside>
      @if (options()?.sidebarTpl) {
        <ng-container [ngTemplateOutlet]="options()!.sidebarTpl!" />
      }
    </aside>
  } @else {
    <aside>
      @if (options()?.sidebarTpl) {
        <ng-container [ngTemplateOutlet]="options()!.sidebarTpl!" />
      }
    </aside>
    <main>
      <ng-container [ngTemplateOutlet]="content" />
    </main>
  }
</div>
