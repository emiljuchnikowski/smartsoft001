@if (mode() !== 'confirm') {
  @let loading = options()?.loading?.();
  <button
    [type]="options()?.type ?? 'button'"
    [class]="buttonClasses() + ' ' + cssClass()"
    [disabled]="disabled() || loading"
    (click)="invoke()"
  >
    @if (loading) {
      <smart-icon name="spinner" />
    } @else {
      <ng-content></ng-content>
    }
  </button>
} @else {
  <div class="smart:inline-flex smart:flex-wrap smart:gap-2">
    <button
      type="button"
      class="smart:inline-flex smart:items-center smart:justify-center smart:gap-x-2 smart:rounded-lg smart:border smart:border-gray-200 smart:bg-white smart:px-4 smart:py-3 smart:text-sm smart:font-medium smart:text-gray-800 smart:shadow-2xs smart:transition-colors smart:hover:bg-gray-50 smart:focus:outline-none smart:focus:bg-gray-50 smart:dark:border-gray-700 smart:dark:bg-gray-800 smart:dark:text-gray-200 smart:dark:hover:bg-gray-700 smart:dark:focus:bg-gray-700"
      (click)="confirmCancel()"
    >
      {{ 'cancel' | translate }}
    </button>
    <button
      type="button"
      class="smart:inline-flex smart:items-center smart:justify-center smart:gap-x-2 smart:rounded-lg smart:border smart:border-blue-600 smart:bg-blue-600 smart:px-4 smart:py-3 smart:text-sm smart:font-medium smart:text-white smart:transition-colors smart:hover:bg-blue-700 smart:focus:outline-none smart:focus:bg-blue-700 smart:dark:border-blue-500 smart:dark:bg-blue-500 smart:dark:hover:bg-blue-600 smart:dark:focus:bg-blue-600"
      (click)="confirmInvoke()"
    >
      {{ 'confirm' | translate }}
    </button>
  </div>
}
