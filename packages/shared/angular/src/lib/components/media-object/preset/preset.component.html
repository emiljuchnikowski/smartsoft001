<div
  [class]="rootClasses() + (cssClass() ? ' ' + cssClass() : '')"
  data-role="root"
  [attr.data-position]="options()?.position ?? 'left'"
  [attr.data-alignment]="options()?.alignment ?? null"
>
  <img
    [class]="mediaClasses()"
    [src]="mediaUrl()"
    [alt]="mediaAlt()"
    data-role="media"
  />
  <div [class]="'smart-media-object-body ' + bodyClasses" data-role="body">
    <ng-content />
  </div>
</div>
