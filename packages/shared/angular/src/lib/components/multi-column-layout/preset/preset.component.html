<div [class]="rootClasses()" data-role="root">
  @if (options()?.headerTpl || options()?.title) {
    <header [class]="headerClasses()" data-role="header">
      @if (options()?.headerTpl) {
        <ng-container [ngTemplateOutlet]="options()!.headerTpl!" />
      } @else if (options()?.title) {
        <h1 [class]="titleClasses()" data-role="title">
          {{ options()?.title }}
        </h1>
      }
    </header>
  }
  <div [class]="rowClasses()">
    @if (options()?.navTpl) {
      <aside [class]="navClasses()" data-role="nav">
        <ng-container [ngTemplateOutlet]="options()!.navTpl!" />
      </aside>
    }
    <main [class]="mainClasses()" data-role="content">
      <div [class]="contentContainerClasses()">
        <ng-content />
      </div>
    </main>
    @if (options()?.secondaryTpl) {
      <aside [class]="secondaryClasses()" data-role="secondary">
        <ng-container [ngTemplateOutlet]="options()!.secondaryTpl!" />
      </aside>
    }
  </div>
</div>
