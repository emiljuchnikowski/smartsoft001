<div [class]="cssClass()" [attr.data-container-width]="containerWidth()">
  <header>
    <nav>
      @if (options()?.navTpl) {
        <ng-container [ngTemplateOutlet]="options()!.navTpl!" />
      }
    </nav>
  </header>
  @if (options()?.headerTpl) {
    <header>
      <ng-container [ngTemplateOutlet]="options()!.headerTpl!" />
    </header>
  } @else if (options()?.title) {
    <header>
      <h1 data-role="title">{{ options()?.title }}</h1>
    </header>
  }
  <main>
    <ng-content />
  </main>
</div>
