<!-- #region usage -->
<smart-button [options]="viewCart">View cart</smart-button>

<smart-drawer
  [(open)]="open"
  title="Shopping cart"
  [options]="options"
  (closed)="onClosed()"
>
  <ul>
    <li>Throwback Hip Bag, $90.00</li>
    <li>Medium Stuff Satchel, $32.00</li>
  </ul>
</smart-drawer>

<p>Times closed: {{ closedCount() }}</p>
<!-- #endregion -->
