<!-- #region usage -->
<smart-sign-in-form
  [options]="options"
  [mode]="mode"
  (submit)="onSubmit($event)"
  (socialClick)="onSocialClick($event)"
/>
@if (signedInAs()) {
  <p>Signed in as {{ signedInAs() }}</p>
}
@if (provider()) {
  <p>Continue with provider: {{ provider() }}</p>
}
<!-- #endregion -->
