<!-- #region usage -->
<button type="button" class="docs-modal-trigger" (click)="open.set(true)">
  Deactivate account
</button>

<smart-modal
  [(open)]="open"
  title="Deactivate account"
  description="Once the account is deactivated all of its data will be permanently removed."
  [actions]="actions"
  [options]="options"
  (actionClick)="onActionClick($event)"
  (closed)="onClosed()"
/>
<!-- #endregion -->
