<!-- #region usage -->
<smart-button [options]="openButton">Open command palette</smart-button>

<smart-command-palette
  [commands]="commands"
  [options]="options"
  [(open)]="open"
  [(query)]="query"
  (runCommand)="onRunCommand($event)"
/>

@if (lastCommand(); as commandId) {
  <p>Last command: {{ commandId }}</p>
}
<!-- #endregion -->
